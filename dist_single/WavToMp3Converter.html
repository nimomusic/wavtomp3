- 브라우저 상단 주소창이나 탭이 없는 깔끔한 Windows 전용 독립 데스크톱 앱 창으로
  웹 화면과 100% 동일하게 즉시 실행됩니다.

---------------------------------------------------------------------
★ 방법 3: Windows 독립 실행 파일 (.exe)로 빌드하기
---------------------------------------------------------------------
1. Windows에 Python 3.9 이상이 설치되어 있는지 확인합니다.
2. [ build_exe.bat ] 파일을 더블클릭합니다.
3. 약 30초~1분 후 [ dist ] 폴더에 [ WavToMp3Converter.exe ]가 자동 생성됩니다!
4. 생성된 .exe를 실행하면 웹 화면과 100% 동일한 데스크톱 앱 창이 실행됩니다.

---------------------------------------------------------------------
[주요 기능]
---------------------------------------------------------------------
- 다중 WAV 파일 일괄 드래그앤드롭 및 선택
- 각 파일별 재생 시간, 샘플 레이트(Hz), 채널 수(스테레오/모노) 표시
- 내장 오디오 미리듣기 플레이어 (재생/일시정지/초기화/탐색바)
- VBR (V0 최고품질 ~ V9 최소용량) 및 CBR (64k ~ 320k) 완벽 지원
- 실시간 변환 진행률 바 및 상태 표시
- 변환된 MP3 개별 다운로드 및 전체 일괄 ZIP 압축 다운로드
- (주)니모뮤직 및 무료 스트리밍 사이트 바로가기 내장
